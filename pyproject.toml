[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-project"
version = "0.1.0"
description = "Bank project frontend and backend foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "openpyxl>=3.1,<4",
  "PyMySQL[rsa]>=1.1,<2",
  "cryptography>=44,<51",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "neo4j>=6.3,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
mock = ["openpyxl>=3.1,<4", "PyMySQL[rsa]>=1.1,<2", "python-dotenv>=1,<2"]

[project.scripts]
bank-project = "bank_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
